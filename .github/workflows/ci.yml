name: CI
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  estilo:
    name: 1. Estilo del código (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar ruff
        run: pip install "$(grep '^ruff==' backend/requirements-dev.txt)"
      - name: Errores y convenciones
        run: ruff check .
      - name: Formato
        run: ruff format --check .
  secretos:
    name: 1. Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar claves y tokens
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose
  frontend:
    name: 1. Frontend (instalar y compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
  unitarias:
    name: 2. Esquema, permisos y pruebas unitarias
    needs: [estilo, secretos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt
      - name: Esquema de la base (generado al día y sus pruebas)
        run: |
          python db/generar_esquema.py | diff - db/esquema_plataforma.sql
          python db/probar_esquema.py db/esquema_plataforma.sql | tail -1
      - name: Matriz de permisos generada al día
        run: python -m app.directus_matriz | diff - ../docs/matriz_permisos.md
        working-directory: backend
      - name: Pruebas de la API, los datos de prueba y las plantillas
        run: python -m pytest -q tests ../datos_prueba/test_datos.py ../plantillas_importacion/test_validar.py ../ejemplos/modulo_simulado/test_modulo.py
        working-directory: backend
      - name: Datos y plantillas generados al día
        run: |
          python datos_prueba/generar_datos.py
          python plantillas_importacion/generar_plantillas.py
          git diff --exit-code -- datos_prueba/csv plantillas_importacion/csv plantillas_importacion/README.md
  integracion:
    name: 3. Integración con el stack real (Directus, API, frontend y módulo)
    needs: [unitarias, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt
      - name: Preparar configuración local
        run: |
          python scripts/configure.py
          echo "LOGIN_RATE_PER_MINUTE=1000" >> .env          # las pruebas inician sesión muchas veces desde la misma IP
      - name: Levantar servicios
        run: docker compose up --build --wait --wait-timeout 300
      - name: Esperar la configuración de Directus y sus verificaciones
        run: |
          id=$(docker compose ps -a -q configurar)
          code=$(timeout 600 docker wait "$id")
          docker compose logs --no-color configurar | tail -50
          test "$code" = "0"
      - name: Pruebas de integración (permisos por departamento, importaciones y grupos)
        run: python -m pytest -q tests_integracion
        working-directory: backend
      - name: Probar el módulo de ejemplo contra Directus real
        run: |
          docker compose --profile demo up --build --wait --wait-timeout 300 --no-deps modulo-simulado
          curl --fail --silent --show-error http://127.0.0.1:8090/estado -o estado.json
          cat estado.json; echo
          grep -q '"conectado":true' estado.json
          curl --fail --silent --show-error --output /dev/null -X POST http://127.0.0.1:8090/registro --data-urlencode "clave=ci"
          curl --fail --silent --show-error http://127.0.0.1:8090/ -o pagina.html
          grep -q "<td>ci</td>" pagina.html
          curl --fail --silent --show-error -X POST http://127.0.0.1:8090/limites -o limites.html
          grep -q "rechazado, correcto" limites.html
          if grep -q "NO fue rechazado" limites.html; then echo "un límite no se cumplió"; cat limites.html; exit 1; fi
      - name: Diagnóstico del módulo de ejemplo
        if: failure()
        run: docker compose --profile demo logs --no-color --tail=40 modulo-simulado
      - name: Probar el frontend
        run: |
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/login
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/login/logo-disc.png
      - name: Probar health y la documentación de la API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | tee health.json
          grep -q '"status":"ok"' health.json
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/docs
          curl --fail --silent --show-error http://127.0.0.1:8000/openapi.json | grep -q '"openapi"'
      - name: Diagnóstico
        if: failure()
        run: docker compose --profile demo logs --no-color --tail=60 configurar api directus
      - name: Detener servicios
        if: always()
        run: docker compose --profile demo down -v
  imagenes:
    name: 4. Imágenes (se publican solo desde main)
    needs: [integracion]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}-frontend:latest
            ${{ steps.image.outputs.name }}-frontend:${{ github.sha }}
