name: disc-scheduling
x-api-env: &api-env
  DIRECTUS_URL: http://directus:8055
  API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?Completa .env}
  SATELITES_DB_PATH: /satelites/satelites.db
  DATA_KEYS: ${DATA_KEYS:?Completa .env}
  DATA_KEY_ID: ${DATA_KEY_ID:-k1}
  INDEX_KEY: ${INDEX_KEY:?Completa .env}
  MODULES: ${MODULES:-base,financiero}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LOGIN_RATE_PER_MINUTE: ${LOGIN_RATE_PER_MINUTE:-10}
x-directus: &directus
  image: docker.io/directus/directus:11.14.1
  environment: &directus-env
    WEBSOCKETS_ENABLED: "false"
    TELEMETRY: "false"
    # límite de peticiones por IP (aplica a quien llegue a Directus, incluidos los satélites)
    RATE_LIMITER_ENABLED: "true"
    RATE_LIMITER_STORE: memory
    RATE_LIMITER_POINTS: "${RATE_LIMIT_POINTS:-60}"
    RATE_LIMITER_DURATION: "60"
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 5s
    start_period: 60s
    retries: 30
services:
  # Una sola vez: crea la base desde el esquema si no existe. Es lo único, junto con el configurador, que abre SQLite.
  migrar:
    image: disc-scheduling-api:local
    build: .
    command: ["python", "-m", "app.migrar"]
    environment:
      DB_PATH: /data/plataforma.db
      SCHEMA_PATH: /app/db/esquema_plataforma.sql
    volumes:
      - plataforma_data:/data
      - satelites_data:/satelites
    restart: "no"
  # Directus del núcleo: la única puerta a plataforma.db. La API le habla con la sesión de cada persona.
  directus:
    <<: *directus
    environment:
      <<: *directus-env
      SECRET: ${DIRECTUS_SECRET:?Completa .env}
      DB_CLIENT: sqlite3
      DB_FILENAME: /data/plataforma.db
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Completa .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Completa .env}
      # la API es un solo cliente que concentra a todas las personas: el límite por IP se aplica en la propia API
      RATE_LIMITER_ENABLED: "false"
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-10m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"
    volumes:
      - plataforma_data:/data
    depends_on:
      migrar:
        condition: service_completed_successfully
  # Directus de los satélites: archivo SQLite aparte con la réplica pub_* y las tablas sat_<grupo>_*
  directus-satelites:
    <<: *directus
    environment:
      <<: *directus-env
      SECRET: ${SAT_DIRECTUS_SECRET:?Completa .env}
      DB_CLIENT: sqlite3
      DB_FILENAME: /satelites/satelites.db
      ADMIN_EMAIL: ${SAT_ADMIN_EMAIL:?Completa .env}
      ADMIN_PASSWORD: ${SAT_ADMIN_PASSWORD:?Completa .env}
    ports:
      - "127.0.0.1:${SATELITES_PORT:-8056}:8055"
    volumes:
      - satelites_data:/satelites
    depends_on:
      migrar:
        condition: service_completed_successfully
  # Una sola vez: roles, permisos y usuarios de ambas instancias de Directus, réplica para los satélites y verificaciones
  configurar:
    image: disc-scheduling-api:local
    command: ["sh", "-c", "python -m app.directus_setup nucleo && python -m app.publicacion && python -m app.directus_setup satelites && python -m app.directus_setup verificar"]
    environment:
      <<: *api-env
      DB_PATH: /data/plataforma.db
      SCHEMA_PATH: /app/db/esquema_plataforma.sql
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Completa .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Completa .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Completa .env}
      SEED_TEST_PASSWORD: ${SEED_TEST_PASSWORD:?Completa .env}
      SATELITES_URL: http://directus-satelites:8055
      SAT_ADMIN_EMAIL: ${SAT_ADMIN_EMAIL:?Completa .env}
      SAT_ADMIN_PASSWORD: ${SAT_ADMIN_PASSWORD:?Completa .env}
      SAT_TOKEN_G1: ${SAT_TOKEN_G1:?Completa .env}
      SAT_TOKEN_G2: ${SAT_TOKEN_G2:?Completa .env}
      SAT_TOKEN_G3: ${SAT_TOKEN_G3:?Completa .env}
      SAT_TOKEN_G4: ${SAT_TOKEN_G4:?Completa .env}
    volumes:
      - plataforma_data:/data
      - satelites_data:/satelites
    depends_on:
      directus:
        condition: service_healthy
      directus-satelites:
        condition: service_healthy
    restart: "no"
  # La API no abre la base: todo pasa por Directus. Solo escribe la réplica de los satélites.
  api:
    image: disc-scheduling-api:local
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - satelites_data:/satelites
    depends_on:
      configurar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Interfaz web (Next.js). Habla con la API desde su propio servidor, por la red interna de Docker.
  frontend:
    image: disc-scheduling-frontend:local
    build: frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
  # Ejemplo de módulo de Proyecto Integrador. Es opcional: docker compose --profile demo up --build
  modulo-simulado:
    profiles: ["demo"]
    image: disc-scheduling-modulo-simulado:local
    build: ejemplos/modulo_simulado
    environment:
      DIRECTUS_URL: http://directus-satelites:8055
      DIRECTUS_TOKEN: ${SAT_TOKEN_G1:?Completa .env}
      GRUPO: g1
    ports:
      - "127.0.0.1:${DEMO_PORT:-8090}:8000"
    depends_on:
      configurar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  plataforma_data:
  satelites_data:
