version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: "Nicolás"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: /frontend
    target-branch: "Nicolás"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    target-branch: "Nicolás"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /
    target-branch: "Nicolás"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
