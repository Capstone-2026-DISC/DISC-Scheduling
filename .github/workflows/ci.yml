name: CI
on:
  push:
    branches: [Main, Test]
  pull_request:
    branches: [Main, Test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q
        working-directory: backend
      - name: Preparar configuración local
        run: python scripts/configure.py
      - name: Levantar servicios
        run: docker compose up --build --wait --wait-timeout 240
      - name: Probar health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | tee health.json
          grep -q '"status":"ok"' health.json
      - name: Diagnóstico
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Detener servicios
        if: always()
        run: docker compose down -v
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
