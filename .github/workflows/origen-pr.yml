name: Origen del pull request

on:
  pull_request:
    branches: [main, test]

jobs:
  origen:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar rama de origen
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "test" ]; then
            echo "main solo recibe cambios desde test"
            exit 1
          fi
          if [ "$BASE" = "test" ]; then
            case "$HEAD" in
              "Nicolás"|Cristian|"Fabián") ;;
              *) echo "test solo recibe cambios desde las ramas personales"; exit 1 ;;
            esac
          fi
